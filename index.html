<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hill Climb Racing</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#6bc3f0}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Arial Black",Arial,sans-serif}
body{position:relative;background:#6bc3f0}
canvas{position:absolute;left:0;top:0;width:100%;height:100%}
.pedal{position:absolute;bottom:10px;width:min(24vw,120px);height:min(28vw,140px);border-radius:10px;background:radial-gradient(circle at 25% 28%,#222 0 6px,transparent 7px),radial-gradient(circle at 50% 28%,#222 0 6px,transparent 7px),radial-gradient(circle at 75% 28%,#222 0 6px,transparent 7px),radial-gradient(circle at 25% 52%,#222 0 6px,transparent 7px),radial-gradient(circle at 50% 52%,#222 0 6px,transparent 7px),radial-gradient(circle at 75% 52%,#222 0 6px,transparent 7px),linear-gradient(#c9cdd1,#8d9298);border:3px solid #4b4f54;color:#333;font-size:14px;text-align:center;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-sizing:border-box;opacity:.92;transition:transform .05s}
.pedal.on{transform:scale(.94) translateY(4px);filter:brightness(.8)}
#brake{left:10px}#gas{right:10px}
#pause{position:absolute;right:10px;top:calc(10px + env(safe-area-inset-top,0px));width:40px;height:40px;border-radius:8px;border:2px solid #fff;background:rgba(0,0,0,.35);color:#fff;font-size:18px}
#retry{display:none;position:absolute;left:12px;top:calc(116px + env(safe-area-inset-top,0px));padding:8px 16px;font:900 14px Arial,sans-serif;border:2px solid #fff;border-radius:8px;background:#e2362f;color:#fff;z-index:5}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,30,50,.55);color:#fff;text-align:center;gap:8px;padding:20px}
#ov h1{margin:0;font-size:clamp(28px,7vw,52px);text-shadow:0 3px 0 #0006}
#ov p{margin:0;font-family:Arial,sans-serif;font-weight:700;font-size:16px;line-height:1.5}
#ov button{margin-top:10px;padding:14px 38px;font:inherit;font-size:20px;border:3px solid #fff;border-radius:12px;background:#e2362f;color:#fff}
</style></head><body>
<canvas id="c"></canvas>
<div id="brake" class="pedal">BRAKE</div><div id="gas" class="pedal">GAS</div>
<button id="pause" aria-label="Pause">II</button>
<button id="retry">RETRY</button>
<div id="ov"><h1 id="t">HILL CLIMB</h1><p id="m">Arrow keys / A-D or the pedals.<br>Gas also tilts the car back in the air; brake tilts it forward.<br>Collect coins and fuel. Don't land on your head!</p><button id="go">START</button></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,dpr,S;
function rs(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;S=Math.min(H/620,W/760)}
addEventListener('resize',rs);rs();

// ---- terrain ----
function h(x){
  if(x<250)return 300;
  const t=Math.min(1,(x-250)/1300),A=(42+Math.min(x/80,62))*t;
  return 300+A*(Math.sin(x*.004)+.5*Math.sin(x*.0113+1.3)+.9*Math.sin(x*.0021+2)+.18*Math.sin(x*.031));
}
function gr(px,py,r){
  const y0=h(px),sl=(h(px+2)-h(px-2))/4,l=Math.hypot(1,sl);
  return{pen:r-(y0-py)/l,nx:sl/l,ny:-1/l,tx:1/l,ty:sl/l};
}

// ---- constants ----
const G=1000,M=1,I=3200,MW=.35,R=26,L0=14,KS=85,CS=9,KP=4000,CP=60,KC=7000,CC=70,KF=40,MU=2,IW=150,TM=19000,OMX=30,BR=25000,REACT=.1,AIRT=16000;
const ANCH=[[-40,20],[44,20]];
const PTS=[[-62,18],[62,18],[-52,-6],[50,-6],[-14,-34],[-52,-30]];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

let B,Wh,coins,fuels,fuel,coinCount,dist,best=0,state='ready',paused=false,nextC,nextF,stuck,cam={x:0,y:0},reason='';
try{best=+localStorage.getItem('hcr_best')||0}catch(e){}
const keys={gas:false,brk:false,kg:false,kb:false,pg:false,pb:false};

function reset(){
  B={x:80,y:232,a:0,vx:0,vy:0,w:0};
  Wh=ANCH.map(a=>({lx:a[0],ly:a[1],x:80+a[0],y:232+a[1]+L0,vx:0,vy:0,om:0,ang:0}));
  coins=[];fuels=[];fuel=1;coinCount=0;dist=0;nextC=500;nextF=1400;stuck=0;
  cam.x=B.x-250;cam.y=B.y-340;
}
reset();

function spawn(){
  while(nextC<B.x+2200){
    const n=4+(Math.random()*5|0),r=Math.random(),v=r<.08?500:r<.35?100:10;
    for(let i=0;i<n;i++){const x=nextC+i*48;coins.push({x,y:h(x)-70-Math.sin(i*.8)*14,v})}
    nextC+=n*48+300+Math.random()*500;
  }
  while(nextF<B.x+2200){fuels.push({x:nextF,y:h(nextF)-75});nextF+=1700+Math.random()*900}
  coins=coins.filter(c=>c.x>B.x-800);fuels=fuels.filter(c=>c.x>B.x-800);
}

// ---- physics ----
function step(dt){
  const b=B,c=Math.cos(b.a),s=Math.sin(b.a),gas=keys.gas,brk=keys.brk;
  let fx=0,fy=M*G,tq=0,grounded=false,hit=false;
  for(const w of Wh){
    const rx=w.lx*c-w.ly*s,ry=w.lx*s+w.ly*c,ax=b.x+rx,ay=b.y+ry;
    const avx=b.vx-b.w*ry,avy=b.vy+b.w*rx,ux=-s,uy=c,px=c,py=s;
    const ex=w.x-(ax+ux*L0),ey=w.y-(ay+uy*L0);
    const sU=ex*ux+ey*uy,sP=ex*px+ey*py;
    const rvx=w.vx-avx,rvy=w.vy-avy,vU=rvx*ux+rvy*uy,vP=rvx*px+rvy*py;
    let fU=KS*sU+CS*vU;
    if(sU<-24)fU+=5000*(sU+24);
    if(sU>8)fU+=5000*(sU-8);
    const fP=KP*sP+CP*vP;
    const sx=-(fU*ux+fP*px),sy=-(fU*uy+fP*py);
    fx-=sx;fy-=sy;tq+=-rx*sy+ry*sx;
    let wfx=sx,wfy=sy+MW*G;
    const g=gr(w.x,w.y,R);
    if(g.pen>0){
      const pen=Math.min(g.pen,18),vn=w.vx*g.nx+w.vy*g.ny;
      let Fn=KC*pen-CC*vn;if(Fn<0)Fn=0;
      wfx+=Fn*g.nx;wfy+=Fn*g.ny;
      const vt=w.vx*g.tx+w.vy*g.ty,mx=MU*Fn;
      const Ft=clamp(-KF*(vt-w.om*R),-mx,mx);
      wfx+=Ft*g.tx;wfy+=Ft*g.ty;
      w.om+=(-R*Ft)/IW*dt;grounded=true;
    }else w.om*=1-.15*dt;
    let tau=0;
    if(gas){tau=Math.max(0,TM*Math.min(1,(1-w.om/OMX)*1.6))}
    else if(brk){
      if(w.om>3)w.om=Math.max(0,w.om-BR/IW*dt);
      else if(w.om>-OMX*.5)tau=-TM*.5;
    }
    w.om+=tau/IW*dt;tq-=REACT*tau;
    w.ang+=w.om*dt;
    w.vx+=wfx/MW*dt;w.vy+=wfy/MW*dt;w.x+=w.vx*dt;w.y+=w.vy*dt;
  }
  for(const p of PTS){
    const rx=p[0]*c-p[1]*s,ry=p[0]*s+p[1]*c,g=gr(b.x+rx,b.y+ry,0);
    if(g.pen>0){
      const pen=Math.min(g.pen,20),pvx=b.vx-b.w*ry,pvy=b.vy+b.w*rx;
      let Fn=3000*pen-40*(pvx*g.nx+pvy*g.ny);if(Fn<0)Fn=0;
      const mx=.6*Fn,Ft=clamp(-8*(pvx*g.tx+pvy*g.ty),-mx,mx);
      const Fx=Fn*g.nx+Ft*g.tx,Fy=Fn*g.ny+Ft*g.ty;
      fx+=Fx;fy+=Fy;tq+=rx*Fy-ry*Fx;hit=true;
    }
  }
  if(!grounded&&!hit){if(gas)tq-=AIRT;if(brk)tq+=AIRT;tq-=2000*b.w}
  tq-=300*b.w;
  if(grounded){const g0=gr(b.x,b.y,0),sa=Math.atan2(g0.ty,g0.tx);let d=sa-b.a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;if(Math.abs(d)<1.2)tq+=2500*d}
  b.vx+=fx/M*dt;b.vy+=fy/M*dt;b.w+=tq/I*dt;
  b.x+=b.vx*dt;b.y+=b.vy*dt;b.a+=b.w*dt;
  // head crash
  const hx=b.x+(-12*c+62*s),hy=b.y+(-12*s-62*c);
  if(gr(hx,hy,12).pen>0){end('Head crash!');return}
  fuel-=dt*(.014+(gas?.02:0));
  if(fuel<=0){fuel=0;if(Math.hypot(b.vx,b.vy)<10){stuck+=dt;if(stuck>1.5)end('Out of fuel!')}}
  if(b.y>h(b.x)+300)end('Fell off the world');
  dist=Math.max(dist,b.x/50);
  for(const k of coins)if(!k.got&&Math.abs(k.x-b.x)<46&&Math.abs(k.y-b.y)<46){k.got=1;k.x=-1e9;coinCount+=k.v;sfxCoin()}
  for(const k of fuels)if(!k.got&&Math.abs(k.x-b.x)<50&&Math.abs(k.y-b.y)<50){k.got=1;k.x=-1e9;fuel=1;sfxFuel()}
}
function end(r){
  if(state!=='play')return;
  state='over';reason=r;overAt=performance.now();
  if(dist>best){best=dist;try{localStorage.setItem('hcr_best',best)}catch(e){}}
  playGameOver();
}
function start(){stopOver();$('retry').style.display='none';$('go').style.display='';reset();state='play';paused=false;$('ov').style.display='none'}
$('go').onclick=()=>{audioInit();if(paused){paused=false;$('ov').style.display='none'}else start()};
$('retry').onclick=()=>{audioInit();start()};
$('pause').onclick=()=>{if(state!=='play')return;paused=true;$('t').textContent='PAUSED';$('m').innerHTML='';$('go').style.display='';$('go').textContent='RESUME';$('ov').style.display='flex'};

// ---- input ----
function upd(){audioInit();keys.gas=keys.kg||keys.pg;keys.brk=keys.kb||keys.pb;$('gas').classList.toggle('on',keys.gas);$('brake').classList.toggle('on',keys.brk)}
addEventListener('keydown',e=>{
  if(['ArrowRight','d','D','ArrowUp'].includes(e.key))keys.kg=true;
  if(['ArrowLeft','a','A','ArrowDown'].includes(e.key))keys.kb=true;
  if(e.key===' '&&state==='over'&&retryReady)start();
  if(e.key==='p'||e.key==='P')$('pause').click();
  upd();if(e.key.startsWith('Arrow')||e.key===' ')e.preventDefault();
});
addEventListener('keyup',e=>{
  if(['ArrowRight','d','D','ArrowUp'].includes(e.key))keys.kg=false;
  if(['ArrowLeft','a','A','ArrowDown'].includes(e.key))keys.kb=false;upd();
});
function pedal(id,k){
  const el=$(id);
  el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);keys[k]=true;upd();e.preventDefault()});
  const up=()=>{keys[k]=false;upd()};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('lostpointercapture',up);
}
pedal('gas','pg');pedal('brake','pb');
addEventListener('blur',()=>{keys.kg=keys.kb=keys.pg=keys.pb=false;upd()});

// ---- rendering ----
function rr(x,y,w,hh,r){ctx.beginPath();ctx.roundRect(x,y,w,hh,r);ctx.fill()}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function txt(t,x,y,sz,col,al){ctx.font='900 '+sz+'px "Arial Black",Arial,sans-serif';ctx.textAlign=al||'left';ctx.textBaseline='middle';ctx.lineWidth=4;ctx.strokeStyle='#1a2b3a';ctx.lineJoin='round';ctx.strokeText(t,x,y);ctx.fillStyle=col||'#fff';ctx.fillText(t,x,y)}
function hash(n){const v=Math.sin(n*127.1)*43758.5453;return v-Math.floor(v)}

function drawCan(x,y,sz){
  ctx.save();ctx.translate(x,y);ctx.scale(sz,sz);
  ctx.fillStyle='#d9261c';rr(-12,-14,24,28,4);
  ctx.fillStyle='#a51a12';rr(-12,-14,24,5,2);rr(-4,-20,12,7,2);
  ctx.fillStyle='#fff';ctx.globalAlpha=.8;rr(-6,-4,12,10,2);ctx.globalAlpha=1;
  ctx.restore();
}

];
let clipIdx=0;try{clipIdx=(+localStorage.getItem('hcr_clip')||0)%CLIPS.length}catch(e){}
let overA=null,overT=null,retryReady=true;
function showRetry(){
  if(retryReady)return;retryReady=true;clearTimeout(overT);
  if(overA){try{overA.pause()}catch(e){}overA=null}
  if(state==='over')$('retry').style.display='block';
}
function stopOver(){clearTimeout(overT);if(overA){try{overA.pause()}catch(e){}overA=null}retryReady=true}
function playGameOver(){
  retryReady=false;
  const url=CLIPS[clipIdx];clipIdx=(clipIdx+1)%CLIPS.length;
  try{localStorage.setItem('hcr_clip',clipIdx)}catch(e){}
  overT=setTimeout(showRetry,5000);
  try{
    const a=new Audio(url);overA=a;
    a.addEventListener('ended',showRetry);a.addEventListener('error',showRetry);
    const p=a.play();if(p&&p.catch)p.catch(showRetry);
  }catch(e){showRetry()}
}
// ---- synthesized sound effects ----
let AC=null,eng=null;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    const o1=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();
    o1.type='sawtooth';o2.type='square';f.type='lowpass';f.frequency.value=420;g.gain.value=0;
    o1.connect(f);o2.connect(f);f.connect(g);g.connect(AC.destination);o1.start();o2.start();
    eng={o1,o2,f,g};
  }catch(e){AC=null}
}
function engineUpdate(){
  if(!AC||!eng)return;
  const on=state==='play'&&!paused,t=AC.currentTime;
  const rpm=on?Math.min(1,Math.abs(Wh[0].om+Wh[1].om)/2/OMX):0,sp=on?Math.min(1,Math.hypot(B.vx,B.vy)/700):0,ld=keys.gas?1:0;
  const fr=34+rpm*70+sp*30+ld*14;
  eng.o1.frequency.setTargetAtTime(fr,t,.06);eng.o2.frequency.setTargetAtTime(fr*.5,t,.06);
  eng.f.frequency.setTargetAtTime(300+rpm*500+ld*250,t,.08);
  eng.g.gain.setTargetAtTime(on?.05+.06*ld+.03*sp:0,t,.08);
}
function tone(f0,f1,at,dur,vol,type){
  if(!AC)return;const t=AC.currentTime+at,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);
}
function sfxCoin(){tone(988,988,0,.09,.14,'square');tone(1319,1319,.07,.25,.14,'square')}
function sfxFuel(){for(let i=0;i<6;i++)tone(180+i*70,320+i*90,i*.09,.1,.16,'sine');tone(500,900,.58,.25,.1,'triangle')}
function sfxCrash(){
  if(!AC)return;
  const n=AC.sampleRate*.5|0,buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=buf;f.type='lowpass';f.frequency.setValueAtTime(2500,AC.currentTime);f.frequency.exponentialRampToValueAtTime(150,AC.currentTime+.5);
  g.gain.value=.5;s.connect(f);f.connect(g);g.connect(AC.destination);s.start();
  tone(140,40,0,.4,.4,'sine');
}

let overAt=0;
let last=performance.now(),acc=0;const DT=1/600;
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='play'&&!paused){acc+=dt;let n=0;while(acc>=DT&&state==='play'){step(DT);acc-=DT;n++}spawn()}
  engineUpdate();render();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
